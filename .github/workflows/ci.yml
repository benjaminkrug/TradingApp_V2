name: CI

on:
  pull_request:
  push:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        working-directory: backend
        run: pip install pytest
      - name: Run tests
        working-directory: backend
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests yet"; fi

  # Probe job only: checks whether nautilus_trader is actually installable
  # here, since the dev sandbox has no PyPI egress and could not verify this
  # (see PHASE2_NOTES.md). continue-on-error so a "no" doesn't block PRs —
  # this is a research spike, not a gate yet.
  probe-nautilus-trader:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Attempt install and print version
        run: |
          pip install nautilus_trader
          python -c "import nautilus_trader; print('nautilus_trader', nautilus_trader.__version__)"

  # Full dependency install (pip install -e .[dev], incl. the eventual
  # backtest framework) is intentionally not part of the main job yet — see
  # PHASE2_NOTES.md. Today's tests (point-in-time guard, reference backtest
  # correctness) are stdlib-only by design so that gate stays meaningful
  # without depending on an unverified install.

  # Phase 5 update: the leakage-detection tests (app/validation/leakage.py,
  # tests/test_leakage.py, tests/test_gate.py) landed as regular stdlib-only
  # tests, so `pytest -q` above already runs them as a required check on
  # every push/PR - no separate job was needed after all. See
  # PHASE5_NOTES.md for what the resulting 12-point gate does and does not
  # yet automate.

  # Phase 8: the FastAPI layer (app/api/) is the first code that actually
  # imports fastapi/pydantic/httpx, none of which are installable in the
  # dev sandbox (PyPI is network-blocked there, see PHASE2_NOTES.md's
  # nautilus_trader precedent). This is the "full dependency install" job
  # the comment above described as deferred - it's needed now. tests/test_api.py
  # is written to skip itself (not fail) when fastapi/httpx aren't
  # importable, so backend-tests above stays green without them; this job
  # installs the real dependencies and runs the full suite so the API tests
  # actually execute, not just skip.
  backend-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend with dev extras (fastapi, httpx, pytest, ...)
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Run full test suite
        working-directory: backend
        run: pytest -q

  # Phase 8 frontend: Vue 3 + TypeScript + Vite (DECISIONS.md). The npm
  # registry is also network-blocked in the dev sandbox (same
  # host_not_allowed policy as PyPI/Alpaca/Polygon - confirmed via
  # `curl -sSI https://registry.npmjs.org/vue`), so none of this could be
  # `npm install`ed or type-checked locally. Verified here instead, the
  # same "write it for real, verify via CI" pattern as backend-api-tests
  # above and the earlier nautilus_trader probe.
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Type-check
        working-directory: frontend
        run: npm run type-check
      - name: Build
        working-directory: frontend
        run: npm run build
