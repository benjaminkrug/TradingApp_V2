name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        working-directory: backend
        run: pip install pytest
      - name: Run tests
        working-directory: backend
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests yet"; fi

  # Full dependency install (pip install -e .[dev], incl. the eventual
  # backtest framework) is intentionally not part of this job yet — see
  # PHASE2_NOTES.md. Today's tests (point-in-time guard, reference backtest
  # correctness) are stdlib-only by design so this gate stays meaningful
  # without depending on an unverified install. Add a full-dependency job
  # once the framework choice in ROADMAP.md Abschnitt 9 is confirmed.

  # Phase 5 fügt hier ein separates Gate hinzu, das die synthetischen
  # Backtest-Korrektheitstests und die Look-Ahead-/Leakage-Detection
  # aus ROADMAP.md Abschnitt 15 als Pflicht-Check vor jedem Merge laufen lässt.
